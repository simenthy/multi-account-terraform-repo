name: terraform-plan (accounts/*)

# Dynamic across every accounts/<name>/ root (nft, devops, and any future
# one) plus modules/**. Deliberately does NOT plan accounts/<name>/pipeline/
# roots — those manage the CI system's own IAM/OIDC trust, and stay a
# manual, human-run `terraform plan`/`apply` (CLAUDE.md §1), rather than
# something CI plans on its own behalf.

on:
  pull_request:
    branches: [main]
    paths:
      - "accounts/**"
      - "modules/**"
      - "policy/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: [main]
    paths:
      - "accounts/**"
      - "modules/**"
      - "policy/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  CONFTEST_VERSION: "0.69.0"
  AWS_REGION: "us-east-1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  detect:
    name: detect affected accounts
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.detect.outputs.accounts }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed accounts/<name>/ roots
        id: detect
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="${head}~1"
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files (${base}..${head}):"
          echo "$changed"

          if echo "$changed" | grep -q '^modules/'; then
            accounts=$(find accounts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          else
            accounts=$(echo "$changed" \
              | grep -E '^accounts/[^/]+/' \
              | grep -vE '^accounts/[^/]+/pipeline/' \
              | cut -d/ -f2 \
              | sort -u || true)
          fi

          if [ -z "$accounts" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "accounts=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix=$(echo "$accounts" | jq -R -s -c '
            split("\n") | map(select(length > 0)) | map({account: ., account_upper: (. | ascii_upcase)})
          ')

          echo "Affected accounts: $matrix"
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "accounts=$matrix" >> "$GITHUB_OUTPUT"

  plan:
    name: plan (${{ matrix.account }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.accounts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[format('AWS_ROLE_ARN_{0}', matrix.account_upper)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install conftest
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSLO "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        working-directory: accounts/${{ matrix.account }}
        run: terraform init -input=false -lockfile=readonly

      - name: terraform validate
        working-directory: accounts/${{ matrix.account }}
        run: terraform validate

      - name: terraform plan
        working-directory: accounts/${{ matrix.account }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan.binary

      - name: terraform show (JSON, for the OPA gate only)
        working-directory: accounts/${{ matrix.account }}
        run: terraform show -json tfplan.binary > tfplan.json

      - name: OPA gate — required tags (Name, Environment, Application)
        working-directory: accounts/${{ matrix.account }}
        run: conftest test --policy ../../policy tfplan.json

      - name: Clean up unredacted plan output
        if: always()
        working-directory: accounts/${{ matrix.account }}
        run: rm -f tfplan.json tfplan.binary

  # One job with a STATIC name that always reports, summarising the whole
  # matrix. This is the job you make a required status check — never the
  # per-account plan jobs, whose names are generated at runtime (§8.3).
  plan-gate:
    name: plan-gate
    needs: [detect, plan]
    if: always() # must run even when `plan` failed or was skipped
    runs-on: ubuntu-latest
    steps:
      - name: Summarise the matrix result
        run: |
          set -euo pipefail
          echo "detect: ${{ needs.detect.result }}"
          echo "plan:   ${{ needs.plan.result }}"

          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "::error::detect job did not succeed"
            exit 1
          fi

          # For a matrix job, needs.<job>.result is the aggregate: success
          # only if EVERY account succeeded. 'skipped' is a legitimate pass —
          # it means no account was affected by this change.
          case "${{ needs.plan.result }}" in
            success) echo "All affected accounts planned cleanly." ;;
            skipped) echo "No accounts affected by this change." ;;
            *)       echo "::error::at least one account's plan did not succeed"
                     exit 1 ;;
          esac